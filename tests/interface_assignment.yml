---

- name: Testing Interface Assignment
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false
      # match_fields: ['description']

    oxlorg.opnsense.list:
      target: 'interface_assignment'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.interface_assignment:
        identifier: "opt1"
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1 - failing because of invalid value
      oxlorg.opnsense.interface_assignment:
        device: "INVALID"
      register: opn_fail1
      failed_when: not opn_fail1.failed
   
    - name: Adding 1
      oxlorg.opnsense.interface_assignment:
        description: "TEST_INTERFACE_1"
        device: "vtnet0"
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Changing 1
      oxlorg.opnsense.interface_assignment:
        identifier: "opt1"
        description: "TEST_INTERFACE_1_CHANGED"
      register: opn9
      failed_when: >
        opn9.failed or
        not opn9.changed
   

    - name: Adding 2
      oxlorg.opnsense.interface_assignment:
        description: "TEST_INTERFACE_2"
        device: "vtnet1"
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.interface_assignment:
        description: "TEST_INTERFACE_2"
        device: "vtnet1"
      register: opn6
      failed_when: >
        opn6.failed or
        opn6.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.interface_assignment:
        identifier: "opt2"
        state: 'absent'
      register: opn7
      failed_when: >
        opn7.failed or
        not opn7.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn8
      failed_when: >
        'data' not in opn8 or
        opn8.data | length != 1
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.interface_assignment:
        identifier: "{{ index }}"
        state: 'absent'
      loop:
        - 'opt1'
        - 'opt2'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode

---

- name: DHCP Subnet
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'dhcp_subnet'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    # DEBUG:
    # - oxlorg.opnsense.raw:
    #     url: 'kea/dhcpv4/search_subnet'
    #   register: info

    # - ansible.builtin.debug:
    #     var: info.response

    # - oxlorg.opnsense.dhcp_subnet:
    #     subnet: "{{ item }}"
    #     state: 'absent'
    #   loop:
    #     - '192.168.88.0/24'
    #     - '192.168.89.0/24'

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.dhcp_subnet:
        subnet: '192.168.88.0/24'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    # - name: Adding 1 - failing because of non-existent subnet
    #   oxlorg.opnsense.dhcp_subnet:
    #     subnet: '192.168.59.0/24'
    #     ip: '192.168.59.76'
    #   register: opn_fail1
    #   failed_when: not opn_fail1.failed

    - name: Adding 1
      oxlorg.opnsense.dhcp_subnet:
        subnet: '192.168.88.0/24'
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Adding 2
      oxlorg.opnsense.dhcp_subnet:
        subnet: '192.168.89.0/24'
        pools:
          - '192.168.89.10-192.168.89.20'
          - '192.168.89.40-192.168.89.50'
        auto_options: false
        gateway: '192.168.89.200'
        dns: '1.1.1.1'
        domain: 'test.lan'
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed

    - name: Changing 2
      oxlorg.opnsense.dhcp_subnet:
        subnet: '192.168.89.0/24'
        pools:
          - '192.168.89.40-192.168.89.60'
          - '192.168.89.110-192.168.89.120'
        auto_options: false
        gateway: '192.168.89.240'
        dns: ['1.1.1.2', '1.0.0.2']
        domain: 'test.lan'
        time_servers: '192.168.89.240'
        tftp_server: '192.168.89.210'
        tftp_file: 'openwrt.bin'
      register: opn3
      failed_when: >
        opn3.failed or
        not opn3.changed
      when: not ansible_check_mode

    - name: Changing 2 - Nothing changed
      oxlorg.opnsense.dhcp_subnet:
        subnet: '192.168.89.0/24'
        pools:
          - '192.168.89.40-192.168.89.60'
          - '192.168.89.110-192.168.89.120'
        auto_options: false
        gateway: '192.168.89.240'
        dns: ['1.1.1.2', '1.0.0.2']
        domain: 'test.lan'
        time_servers: '192.168.89.240'
        tftp_server: '192.168.89.210'
        tftp_file: 'openwrt.bin'
      register: opn4
      failed_when: >
        opn4.failed or
        opn4.changed
      when: not ansible_check_mode

    - name: Changing 2 - only options
      oxlorg.opnsense.dhcp_subnet:
        subnet: '192.168.89.0/24'
        pools:
          - '192.168.89.40-192.168.89.60'
          - '192.168.89.110-192.168.89.120'
        auto_options: false
        gateway: '192.168.89.241'
        dns: ['1.1.1.2', '1.0.0.2']
        domain: 't3st.lan'
        time_servers: '192.168.89.240'
        tftp_server: '192.168.89.210'
        tftp_file: 'openwrt.bin'
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed
      when: not ansible_check_mode

    - name: Changing 2 - nothing changed
      oxlorg.opnsense.dhcp_subnet:
        subnet: '192.168.89.0/24'
        pools:
          - '192.168.89.40-192.168.89.60'
          - '192.168.89.110-192.168.89.120'
        auto_options: false
        gateway: '192.168.89.241'
        dns: ['1.1.1.2', '1.0.0.2']
        domain: 't3st.lan'
        time_servers: '192.168.89.240'
        tftp_server: '192.168.89.210'
        tftp_file: 'openwrt.bin'
      register: opn5_2
      failed_when: >
        opn5_2.failed or
        opn5_2.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn8
      failed_when: >
        'data' not in opn8 or
        opn8.data | length != 2
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.dhcp_subnet:
        subnet: '192.168.89.0/24'
        state: absent
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.dhcp_subnet:
        subnet: "{{ item }}"
        state: 'absent'
      loop:
        - '192.168.88.0/24'
        - '192.168.89.0/24'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode
